services:
  bot:
    build:
      context: .
      dockerfile: dockerfile
    container_name: finance_bot
    env_file:
      - .env
    depends_on:
      - redis:
          condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMS", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  redis_data: